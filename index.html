<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tour Customs</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

<style>

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Orbitron', sans-serif;

background:
linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)),
url("https://images.unsplash.com/photo-1503376780353-7e6692767b70");

background-size:cover;
background-position:center;
background-attachment:fixed;

color:white;
padding:15px;
}

.logo{
text-align:center;
font-size:34px;
font-weight:700;
color:#ff0000;
margin-bottom:5px;
}

.sub{
text-align:center;
font-size:13px;
color:#aaa;
margin-bottom:25px;
}

.container{
max-width:1000px;
margin:auto;
}

.box{
background:#161616;
border:1px solid #2a2a2a;
padding:18px;
border-radius:12px;
margin-bottom:20px;
}

h2{
margin-bottom:10px;
color:#ff0000;
font-size:17px;
border-bottom:1px solid #333;
padding-bottom:5px;
}

label{
display:flex;
justify-content:space-between;
margin:7px 0;
cursor:pointer;
font-size:13px;
}

.resultado{
text-align:center;
font-size:18px;
}

.total{
font-size:23px;
color:#00ff88;
margin:10px 0;
}

button{
background:#ff0000;
border:none;
padding:10px 18px;
border-radius:8px;
color:white;
cursor:pointer;
margin-top:10px;
}

button:hover{
opacity:0.8;
}

.parceria{
color:#00ff88;
font-size:13px;
margin-top:5px;
}

</style>

</head>
<script>

const usuarioCorreto = "Mecanico"
const senhaCorreta = "4321"

function login(){

let user = document.getElementById("user").value
let pass = document.getElementById("pass").value

if(user === usuarioCorreto && pass === senhaCorreta){

localStorage.setItem("logado","sim")

document.getElementById("loginTela").style.display="none"
document.getElementById("site").style.display="block"

}else{
document.getElementById("erroLogin").innerText="Usuário ou senha incorreto"
}

}

</script>
<body>

<!-- LOGIN -->
<div id="loginTela" style="
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
">

<div style="
background:#161616;
padding:30px;
border-radius:10px;
width:300px;
text-align:center;
border:1px solid #333;
">

<h2 style="color:#ff0000;margin-bottom:20px;">LOGIN MECÂNICA</h2>

<input id="user" placeholder="Usuario"
style="width:100%;padding:8px;margin-bottom:10px;background:#0d0d0d;border:1px solid #444;color:white;border-radius:5px;">

<input id="pass" type="password" placeholder="Senha"
style="width:100%;padding:8px;margin-bottom:15px;background:#0d0d0d;border:1px solid #444;color:white;border-radius:5px;">

<button onclick="login()">Entrar</button>

<div id="erroLogin" style="color:red;margin-top:10px;"></div>

</div>
</div>

<div class="container" id="site" style="display:none;">

<div class="logo">TOUR CUSTOMS</div>
<div class="sub">Calculadora Oficial de Modificações</div>
