<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tour Customs</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

<style>

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Orbitron', sans-serif;
background:linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)),
url("https://images.unsplash.com/photo-1503376780353-7e6692767b70");
background-size:cover;
background-position:center;
background-attachment:fixed;
color:white;
padding:15px;
}

.logo{
text-align:center;
font-size:34px;
font-weight:700;
color:#ff0000;
margin-bottom:5px;
}

.sub{
text-align:center;
font-size:13px;
color:#aaa;
margin-bottom:25px;
}

.container{
max-width:1000px;
margin:auto;
}

.box{
background:#161616;
border:1px solid #2a2a2a;
padding:18px;
border-radius:12px;
margin-bottom:20px;
}

h2{
margin-bottom:10px;
color:#ff0000;
font-size:17px;
border-bottom:1px solid #333;
padding-bottom:5px;
}

label{
display:flex;
justify-content:space-between;
margin:7px 0;
cursor:pointer;
font-size:13px;
}

.resultado{
text-align:center;
font-size:18px;
}

.total{
font-size:23px;
color:#00ff88;
margin:10px 0;
}

button{
background:#ff0000;
border:none;
padding:10px 18px;
border-radius:8px;
color:white;
cursor:pointer;
margin-top:10px;
}

button:hover{
opacity:0.8;
}

.parceria{
color:#00ff88;
font-size:13px;
margin-top:5px;
}

input{
width:100%;
padding:8px;
background:#0d0d0d;
border:1px solid #444;
color:white;
border-radius:5px;
margin-top:5px;
}

</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginTela" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#000;display:flex;align-items:center;justify-content:center;z-index:9999;">

<div style="background:#161616;padding:30px;border-radius:10px;width:300px;text-align:center;border:1px solid #333;">

<h2 style="color:#ff0000;margin-bottom:20px;">LOGIN MECÂNICA</h2>

<input id="user" placeholder="Usuário">
<input id="pass" type="password" placeholder="Senha">

<button onclick="login()">Entrar</button>

<div id="erroLogin" style="color:red;margin-top:10px;"></div>

</div>
</div>

<div class="container" id="site" style="display:none;">

<div class="logo">TOUR CUSTOMS</div>
<div class="sub">Calculadora Oficial de Modificações</div>

<div class="box">
<h2>CLIENTE</h2>
<input id="cliente" placeholder="Nome do Cliente">
<input id="veiculo" placeholder="Veículo">
</div>

<div class="box resultado">
<div>Total:</div>
<div class="total" id="total">R$ 0,00</div>
<div>Itens: <span id="itens">0</span></div>
<div class="parceria" id="infoParceria"></div>

<button onclick="limpar()">Limpar Tudo</button>
<button onclick="copiarOrcamento()">Copiar Orçamento</button>
<button onclick="gerarOS()">Gerar OS</button>

</div>

<div class="box">
<h2>HISTÓRICO</h2>
<div id="historico"></div>
</div>

</div>

<script>

let historico = JSON.parse(localStorage.getItem("historico")) || []

const WEBHOOK = "https://discord.com/api/webhooks/1482806727991623771/dOor1_q1CaregAJ9olakRPfdxgVgrApHxWukDsy0Kuf3-tS_y1z83bc18Hm5EmZtbkiK"

function gerarOS(){

let cliente = document.getElementById("cliente").value
let veiculo = document.getElementById("veiculo").value
let total = document.getElementById("total").innerText

if(!cliente || !veiculo){
alert("Preencha nome e veículo!")
return
}

let os =
"📄 ORDEM DE SERVIÇO - TOUR CUSTOMS\n\n"+
"👤 Cliente: "+cliente+"\n"+
"🚗 Veículo: "+veiculo+"\n"+
"💰 Valor: "+total

salvarHistorico(os)

fetch(WEBHOOK,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body: JSON.stringify({
content: os
})
})
.then(response=>{
if(response.ok){
alert("✅ OS enviada para o Discord!")
}else{
alert("❌ Erro ao enviar para o Discord")
}
})
.catch(()=>{
alert("❌ Falha de conexão com Discord")
})

}

function salvarHistorico(texto){

historico.push(texto)

localStorage.setItem("historico",JSON.stringify(historico))

mostrarHistorico()

}

function mostrarHistorico(){

let area = document.getElementById("historico")

area.innerHTML=""

historico.forEach(os=>{
area.innerHTML += "<pre>"+os+"</pre>"
})

}

function limpar(){

document.getElementById("total").innerText="R$ 0,00"
document.getElementById("itens").innerText="0"
document.getElementById("infoParceria").innerText=""

}

function copiarOrcamento(){

let total = document.getElementById("total").innerText
let itens = document.getElementById("itens").innerText

let texto =
"🔧 TOUR CUSTOMS\n\n"+
"Itens: "+itens+"\n"+
"Total: "+total

navigator.clipboard.writeText(texto)

alert("Orçamento copiado!")

}

function login(){

let user = document.getElementById("user").value
let pass = document.getElementById("pass").value

if(user === "mecanico" && pass === "1234"){

localStorage.setItem("logado","sim")

document.getElementById("loginTela").style.display="none"
document.getElementById("site").style.display="block"

}else{

document.getElementById("erroLogin").innerText="Usuário ou senha incorreto"

}

}

window.onload = function(){

mostrarHistorico()

let logado = localStorage.getItem("logado")

if(logado === "sim"){

document.getElementById("loginTela").style.display="none"
document.getElementById("site").style.display="block"

}

}

window.addEventListener("beforeunload", function () {
localStorage.removeItem("logado")
})

</script>

</body>
</html>
