<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tour Customs</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Orbitron', sans-serif;
background:
linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)),
url("https://images.unsplash.com/photo-1503376780353-7e6692767b70");
background-size:cover;
background-position:center;
background-attachment:fixed;
color:white;
padding:15px;
}

.logo{text-align:center;font-size:34px;color:#ff0000;margin-bottom:5px;}
.sub{text-align:center;font-size:13px;color:#aaa;margin-bottom:25px;}
.container{max-width:1000px;margin:auto;}

.box{
background:#161616;
border:1px solid #2a2a2a;
padding:18px;
border-radius:12px;
margin-bottom:20px;
}

h2{color:#ff0000;margin-bottom:10px;}

label{
display:flex;
justify-content:space-between;
margin:7px 0;
font-size:13px;
}

.total{font-size:23px;color:#00ff88;margin:10px 0;text-align:center;}

button{
background:#ff0000;
border:none;
padding:10px 18px;
border-radius:8px;
color:white;
cursor:pointer;
margin-top:10px;
}

.parceria{color:#00ff88;font-size:13px;margin-top:5px;}
</style>
</head>

<body>

<div class="container">

<div class="logo">TOUR CUSTOMS</div>
<div class="sub">Calculadora Oficial de Modificações</div>

<!-- RESULTADO -->
<div class="box">
<div>Total:</div>
<div class="total" id="total">R$ 0,00</div>
Itens: <span id="itens">0</span>
<div id="infoParceria" class="parceria"></div>
<button onclick="limpar()">Limpar Tudo</button>
</div>

<!-- ORDEM DE SERVIÇO -->
<div class="box">
<h2>ORDEM DE SERVIÇO</h2>

<input id="cliente" placeholder="Nome do cliente" style="width:100%;margin:5px 0;padding:8px;background:#0d0d0d;border:1px solid #444;color:white;">
<input id="veiculo" placeholder="Veículo" style="width:100%;margin:5px 0;padding:8px;background:#0d0d0d;border:1px solid #444;color:white;">

<select id="mecanico" style="width:100%;padding:8px;background:#0d0d0d;border:1px solid #444;color:white;">
<option value="">Selecionar mecânico</option>
<option>João</option>
<option>Carlos</option>
<option>Pedro</option>
</select>

<button onclick="gerarOS()">Gerar OS</button>
<button onclick="copiarDiscord()">Copiar Orçamento</button>

</div>

<!-- HISTÓRICO -->
<div class="box">
<h2>Histórico</h2>
<div id="historico"></div>
</div>

<!-- RANKING -->
<div class="box">
<h2>Ranking Mecânicos</h2>
<div id="ranking"></div>
</div>

</div>

<script>

let ranking = {}

function calc(){
let total=0
let itens=0

document.querySelectorAll("input[type=checkbox]").forEach(el=>{
if(el.checked){
total+=parseFloat(el.value||0)
itens++
}
})

document.getElementById("total").innerText="R$ "+total.toLocaleString("pt-BR")
document.getElementById("itens").innerText=itens
}

function limpar(){
document.querySelectorAll("input[type=checkbox]").forEach(c=>c.checked=false)
document.getElementById("total").innerText="R$ 0,00"
document.getElementById("itens").innerText="0"
document.getElementById("infoParceria").innerText=""
}

function gerarOS(){

let cliente=document.getElementById("cliente").value
let veiculo=document.getElementById("veiculo").value
let mecanico=document.getElementById("mecanico").value
let total=document.getElementById("total").innerText

if(!cliente||!veiculo||!mecanico){
alert("Preencha cliente, veículo e mecânico")
return
}

let os=`
Cliente: ${cliente}<br>
Veículo: ${veiculo}<br>
Mecânico: ${mecanico}<br>
Total: ${total}<hr>
`

document.getElementById("historico").innerHTML=
os+document.getElementById("historico").innerHTML

if(!ranking[mecanico]) ranking[mecanico]=0
ranking[mecanico]++

mostrarRanking()
}

function copiarDiscord(){

let texto=`📋 ORÇAMENTO MECÂNICA TOUR

Cliente: ${cliente.value}
Veículo: ${veiculo.value}
${total.innerText}`

navigator.clipboard.writeText(texto)

alert("Copiado para enviar no Discord ✅")
}

function mostrarRanking(){

let area=document.getElementById("ranking")
area.innerHTML=""

for(let m in ranking){
area.innerHTML+=`${m} - ${ranking[m]} serviços<br>`
}
}

</script>

</body>
</html>
