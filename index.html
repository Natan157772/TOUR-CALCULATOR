<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tour Customs</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

<style>

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Orbitron', sans-serif;

background:
linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)),
url("https://images.unsplash.com/photo-1503376780353-7e6692767b70");

background-size:cover;
background-position:center;
background-attachment:fixed;

color:white;
padding:15px;
}

.logo{
text-align:center;
font-size:34px;
font-weight:700;
color:#ff0000;
margin-bottom:5px;
}

.sub{
text-align:center;
font-size:13px;
color:#aaa;
margin-bottom:25px;
}

.container{
max-width:1000px;
margin:auto;
}

.box{
background:#161616;
border:1px solid #2a2a2a;
padding:18px;
border-radius:12px;
margin-bottom:20px;
}

h2{
margin-bottom:10px;
color:#ff0000;
font-size:17px;
border-bottom:1px solid #333;
padding-bottom:5px;
}

label{
display:flex;
justify-content:space-between;
margin:7px 0;
cursor:pointer;
font-size:13px;
}

.resultado{
text-align:center;
font-size:18px;
}

.total{
font-size:23px;
color:#00ff88;
margin:10px 0;
}

button{
background:#ff0000;
border:none;
padding:10px 18px;
border-radius:8px;
color:white;
cursor:pointer;
margin-top:10px;
}

button:hover{
opacity:0.8;
}

.parceria{
color:#00ff88;
font-size:13px;
margin-top:5px;
}

@media(max-width:600px){

.logo{font-size:26px;}

label{font-size:12px;}

}

</style>
</head>

<body>

<div class="container">

<div class="logo">TOUR CUSTOMS</div>
<div class="sub">Calculadora Oficial de Modificações</div>

<div class="box resultado">

<div>Total:</div>
<div class="total" id="total">R$ 0,00</div>

<div>Itens: <span id="itens">0</span></div>

<div class="parceria" id="infoParceria"></div>

<button onclick="limpar()">Limpar Tudo</button>

</div>

<div class="box">

<h2>DESCONTO</h2>

<label>

<span>

<input type="checkbox" id="ativarDesconto" onchange="calc()">

Aplicar desconto

</span>

<span>

<input type="number"

id="porcentagem"

value="10"

min="0"

max="100"

style="width:60px;background:#0d0d0d;border:1px solid #444;color:white;border-radius:5px;text-align:center;"

oninput="calc()">

%

</span>

</label>

</div>

<div class="box">

<h2>CAIXA DA OFICINA</h2>

<div id="caixaTotal">R$ 0</div>

</div>

</div>

<script>

let ranking = JSON.parse(localStorage.getItem("ranking")) || {}

let historicoOS = JSON.parse(localStorage.getItem("historicoOS")) || []

let caixa = JSON.parse(localStorage.getItem("caixa")) || 0

function salvarDados(){

localStorage.setItem("ranking", JSON.stringify(ranking))

localStorage.setItem("historicoOS", JSON.stringify(historicoOS))

localStorage.setItem("caixa", JSON.stringify(caixa))

}

function calc(){

let total = 0
let itens = 0
let fullTotal = 0

document.querySelectorAll("input[type=checkbox]").forEach(el=>{

if(el.checked && el.id!=="ativarDesconto" && el.id!=="parceria"){

let v = parseFloat(el.value || 0)

total += v

itens++

if(el.classList.contains("full")){

fullTotal += v

}

}

})

let parceria = document.getElementById("parceria")?.checked

let descontoAtivo = document.getElementById("ativarDesconto").checked

let porcentagem = parseFloat(document.getElementById("porcentagem").value || 0)

let info = document.getElementById("infoParceria")

if(parceria && fullTotal>0){

let desconto = fullTotal * 0.20

total -= desconto

info.innerText = "Parceria aplicada (-20% Full Tuning)"

}

else if(descontoAtivo && porcentagem>0){

let desconto = total * (porcentagem/100)

total -= desconto

info.innerText = `Desconto aplicado (-${porcentagem}%)`

}

else{

info.innerText=""

}

document.getElementById("total").innerText =

"R$ " + total.toLocaleString("pt-BR")

document.getElementById("itens").innerText = itens

}

function limpar(){

document.querySelectorAll("input[type=checkbox]").forEach(c=>c.checked=false)

document.getElementById("total").innerText="R$ 0,00"

document.getElementById("itens").innerText="0"

document.getElementById("infoParceria").innerText=""

}

window.onload = function(){

document.getElementById("caixaTotal").innerText =

"R$ " + caixa.toLocaleString('pt-BR')

}

</script>

</body>
</html>
