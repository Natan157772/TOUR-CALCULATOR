<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tour Customs</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

<style>

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Orbitron', sans-serif;

background:
linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)),
url("https://images.unsplash.com/photo-1503376780353-7e6692767b70");

background-size:cover;
background-position:center;
background-attachment:fixed;

color:white;
padding:15px;
}

.logo{
text-align:center;
font-size:34px;
font-weight:700;
color:#ff0000;
margin-bottom:5px;
}

.sub{
text-align:center;
font-size:13px;
color:#aaa;
margin-bottom:25px;
}

.container{
max-width:1000px;
margin:auto;
}

.box{
background:#161616;
border:1px solid #2a2a2a;
padding:18px;
border-radius:12px;
margin-bottom:20px;
}

h2{
margin-bottom:10px;
color:#ff0000;
font-size:17px;
border-bottom:1px solid #333;
padding-bottom:5px;
}

label{
display:flex;
justify-content:space-between;
margin:7px 0;
cursor:pointer;
font-size:13px;
}

.resultado{
text-align:center;
font-size:18px;
}

.total{
font-size:23px;
color:#00ff88;
margin:10px 0;
}

button{
background:#ff0000;
border:none;
padding:10px 18px;
border-radius:8px;
color:white;
cursor:pointer;
margin-top:10px;
}

button:hover{
opacity:0.8;
}

.parceria{
color:#00ff88;
font-size:13px;
margin-top:5px;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">TOUR CUSTOMS</div>
<div class="sub">Calculadora Oficial de Modificações</div>


<div class="box">

<h2>CLIENTE</h2>

<input id="cliente" placeholder="Nome do Cliente"
style="width:100%;padding:8px;background:#0d0d0d;border:1px solid #444;color:white;border-radius:5px;">

<input id="veiculo" placeholder="Veículo"
style="width:100%;padding:8px;background:#0d0d0d;border:1px solid #444;color:white;border-radius:5px;margin-top:8px;">

</div>


<div class="box resultado">

<div>Total:</div>
<div class="total" id="total">R$ 0,00</div>

<div>Itens: <span id="itens">0</span></div>

<div class="parceria" id="infoParceria"></div>

<button onclick="limpar()">Limpar Tudo</button>

<button onclick="copiarOrcamento()">Copiar Orçamento</button>

<button onclick="gerarOS()">Gerar OS</button>

</div>


<div class="box">

<h2>DESCONTO</h2>

<label>

<span>
<input type="checkbox" id="ativarDesconto" onchange="calc()">
Aplicar desconto
</span>

<span>
<input type="number"
id="porcentagem"
value="10"
min="0"
max="100"
style="width:60px;background:#0d0d0d;border:1px solid #444;color:white;border-radius:5px;text-align:center;"
oninput="calc()">
%
</span>

</label>

</div>


<div class="box">

<h2>FULL TUNING</h2>

<label><span><input type="checkbox" class="full" value="75000" onchange="calc()">Carro sem blindagem</span><span>R$ 75.000</span></label>

<label><span><input type="checkbox" class="full" value="150000" onchange="calc()">Carro com blindagem</span><span>R$ 150.000</span></label>

<label><span><input type="checkbox" class="full" value="60000" onchange="calc()">Moto sem blindagem</span><span>R$ 60.000</span></label>

<label><span><input type="checkbox" class="full" value="95000" onchange="calc()">Moto com blindagem</span><span>R$ 95.000</span></label>

<label><span><input type="checkbox" value="2500" onchange="calc()">Kit reparo</span><span>R$ 2.500</span></label>

<label><span><input type="checkbox" value="4500" onchange="calc()">Suspensão a ar</span><span>R$ 4.500</span></label>

<label><span><input type="checkbox" value="2500" onchange="calc()">Nitro</span><span>R$ 2.500</span></label>

<label><span><input type="checkbox" id="parceria" onchange="calc()">Aplicar Parceria (20% OFF Full)</span><span style="color:#00ff88;">DESCONTO</span></label>

</div>
<div class="box">
<h2>EXTERIOR</h2>
<label><span><input type="checkbox" value="7500" onchange="calc()">Aerofólio</span><span>R$ 7.500</span></label>
<label><span><input type="checkbox" value="6000" onchange="calc()">Parachoque Dianteiro</span><span>R$ 6.000</span></label>
<label><span><input type="checkbox" value="6000" onchange="calc()">Parachoque Traseiro</span><span>R$ 6.000</span></label>
<label><span><input type="checkbox" value="5000" onchange="calc()">Saia</span><span>R$ 5.000</span></label>
<label><span><input type="checkbox" value="4500" onchange="calc()">Escapamento</span><span>R$ 4.500</span></label>

<label><span><input type="checkbox" value="5500" onchange="calc()">Chassi</span><span>R$ 5.500</span></label>
<label><span><input type="checkbox" value="4000" onchange="calc()">Grelha</span><span>R$ 4.000</span></label>
<label><span><input type="checkbox" value="6500" onchange="calc()">Capô</span><span>R$ 6.500</span></label>
<label><span><input type="checkbox" value="4500" onchange="calc()">Para-lama</span><span>R$ 4.500</span></label>
<label><span><input type="checkbox" value="7000" onchange="calc()">Teto</span><span>R$ 7.000</span></label>
<label><span><input type="checkbox" value="3000" onchange="calc()">Placa</span><span>R$ 3.000</span></label>
</div>

<div class="box">
<h2>INTERIOR</h2>
<label><span><input type="checkbox" value="2500" onchange="calc()">Buzina</span><span>R$ 2.500</span></label>
<label><span><input type="checkbox" value="9000" onchange="calc()">Blindagem</span><span>R$ 9.000</span></label>
<label><span><input type="checkbox" value="6000" onchange="calc()">Interior</span><span>R$ 6.000</span></label>

<label><span><input type="checkbox" value="3500" onchange="calc()">Vidro</span><span>R$ 3.500</span></label>
</div>

<div class="box">
<h2>ILUMINAÇÃO</h2>
<label><span><input type="checkbox" value="7500" onchange="calc()">Farol</span><span>R$ 7.500</span></label>
<label><span><input type="checkbox" value="2500" onchange="calc()">Neon</span><span>R$ 2.500</span></label>
</div>

<div class="box">
<h2>ESTÉTICA</h2>
<label><span><input type="checkbox" value="7500" onchange="calc()">Decal</span><span>R$ 7.500</span></label>
<label><span><input type="checkbox" value="7500" onchange="calc()">Rodas</span><span>R$ 7.500</span></label>
</div>

<div class="box">
<h2>PINTURA</h2>
<label><span><input type="checkbox" value="8000" onchange="calc()">Cromado</span><span>R$ 8.000</span></label>
<label><span><input type="checkbox" value="4000" onchange="calc()">Fosca</span><span>R$ 4.000</span></label>
<label><span><input type="checkbox" value="4000" onchange="calc()">Metálica</span><span>R$ 4.000</span></label>
<label><span><input type="checkbox" value="4000" onchange="calc()">Metal</span><span>R$ 4.000</span></label>
</div>


<div class="box">

<h2>HISTÓRICO</h2>

<div id="historico"></div>

</div>

</div>


<script>

let historico = JSON.parse(localStorage.getItem("historico")) || []
// 🔥 WEBHOOK DISCORD
const WEBHOOK = "https://discord.com/api/webhooks/1482806727991623771/dOor1_q1CaregAJ9olakRPfdxgVgrApHxWukDsy0Kuf3-tS_y1z83bc18Hm5EmZtbkiK";

function calc(){

let total = 0
let itens = 0
let fullTotal = 0

document.querySelectorAll("input[type=checkbox]").forEach(el=>{

if(el.checked && el.id!=="ativarDesconto" && el.id!=="parceria"){

let v=parseFloat(el.value||0)

total+=v
itens++

if(el.classList.contains("full")){
fullTotal+=v
}

}

})

let parceria = document.getElementById("parceria").checked
let descontoAtivo = document.getElementById("ativarDesconto").checked
let porcentagem = parseFloat(document.getElementById("porcentagem").value || 0)

let info = document.getElementById("infoParceria")

if(parceria && fullTotal>0){

let desconto = fullTotal * 0.20
total -= desconto
info.innerText = "Parceria aplicada (-20% Full Tuning)"

}

else if(descontoAtivo && porcentagem>0){

let desconto = total * (porcentagem/100)
total -= desconto
info.innerText = `Desconto aplicado (-${porcentagem}%)`

}

else{
info.innerText=""
}

document.getElementById("total").innerText =
"R$ " + total.toLocaleString("pt-BR")

document.getElementById("itens").innerText = itens

}


function limpar(){

document.querySelectorAll("input[type=checkbox]").forEach(c=>c.checked=false)

document.getElementById("total").innerText="R$ 0,00"

document.getElementById("itens").innerText="0"

document.getElementById("infoParceria").innerText=""

}


function copiarOrcamento(){

let total = document.getElementById("total").innerText
let itens = document.getElementById("itens").innerText

let texto =
"🔧 TOUR CUSTOMS\n\n"+
"Itens: "+itens+"\n"+
"Total: "+total

navigator.clipboard.writeText(texto)

alert("Orçamento copiado!")

}

function gerarOS(){

let cliente = document.getElementById("cliente").value
let veiculo = document.getElementById("veiculo").value
let total = document.getElementById("total").innerText

if(!cliente || !veiculo){
alert("Preencha nome e veículo!")
return
}

let os =
"📄 ORDEM DE SERVIÇO - TOUR CUSTOMS\n\n"+
"👤 Cliente: "+cliente+"\n"+
"🚗 Veículo: "+veiculo+"\n"+
"💰 Valor: "+total

// salvar histórico
salvarHistorico(os)

// enviar para o Discord
fetch(WEBHOOK,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body: JSON.stringify({
content: os
})
})
.then(response=>{
if(response.ok){
alert("✅ OS enviada para o Discord!")
}else{
alert("❌ Erro ao enviar. Verifique o webhook.")
}
})
.catch(error=>{
console.error(error)
alert("❌ Ero de conexão com Discord")
})

}

function salvarHistorico(texto){

historico.push(texto)

localStorage.setItem("historico",JSON.stringify(historico))

mostrarHistorico()

}


function mostrarHistorico(){

let area = document.getElementById("historico")

area.innerHTML=""

historico.forEach(os=>{
area.innerHTML += "<pre>"+os+"</pre>"
})

}


window.onload = mostrarHistorico

</script>

</body>
  <script>

/* =========================
   🔒 LOGIN PRO TOUR CUSTOMS
========================= */

const LOGIN_CORRETO = "Mecanico"
const SENHA_CORRETA = "1234"

function fazerLogin(){

let user = document.getElementById("loginUser").value
let senha = document.getElementById("loginSenha").value

if(user === LOGIN_CORRETO && senha === SENHA_CORRETA){

sessionStorage.setItem("logado","true")
sessionStorage.setItem("mecanico",user)

document.getElementById("loginTela").style.display="none"
mostrarMecanico()

}else{
document.getElementById("loginErro").innerText="Login ou senha incorretos"
}

}

/* ENTER FAZ LOGIN */
document.addEventListener("keypress",(e)=>{
if(e.key==="Enter"){
fazerLogin()
}
})

/* VERIFICA LOGIN */
window.addEventListener("load",()=>{

if(sessionStorage.getItem("logado")==="true"){
document.getElementById("loginTela").style.display="none"
mostrarMecanico()
}else{
document.getElementById("loginTela").style.display="flex"
}

})

/* MOSTRAR MECÂNICO */
function mostrarMecanico(){

let nome = sessionStorage.getItem("mecanico")

let topo = document.createElement("div")
topo.id="painelMecanico"
topo.style=`
position:fixed;
top:10px;
right:10px;
background:#111;
padding:10px 15px;
border:1px solid #333;
border-radius:8px;
font-size:13px;
z-index:999;
`

topo.innerHTML=`
👤 Mecânico: ${nome}
<br>
<button onclick="logout()" style="
margin-top:5px;
background:#ff0000;
border:none;
padding:5px 10px;
color:white;
border-radius:5px;
cursor:pointer;">
Sair
</button>
`

document.body.appendChild(topo)
}

/* LOGOUT */
function logout(){
sessionStorage.clear()
location.reload()
}

/* =========================
   📄 GERAR ORDEM DE SERVIÇO
========================= */

function gerarOS(){

let total = document.querySelector(".total")?.innerText || "0"

let mecanico = sessionStorage.getItem("mecanico")

let texto =
`===== TOUR CUSTOMS =====
Mecânico: ${mecanico}

Valor Total: ${total}

========================`

navigator.clipboard.writeText(texto)

alert("OS copiada!")
}

</script>
</html>
